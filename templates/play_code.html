{% extends "base.html" %}
{% block body %}
<main class="wrap">
  <section class="card center stack">
    <h1>🎮 Choisis un quiz</h1>
    <div class="stack" id="lib"><p class="muted">Chargement…</p></div>
    <details class="stack">
      <summary class="muted">J'ai un code de partie</summary>
      <input class="code-input" id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="off">
      <div class="error" id="err"></div>
      <button class="btn pink" id="go">Rejoindre</button>
    </details>
    <a class="btn ghost" href="/">Retour</a>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script>
  const code = $('#code'), err = $('#err'), lib = $('#lib');
  async function go() {
    err.textContent = '';
    try { await api(`/api/sessions/${code.value.trim()}/exists`); location.href = `/j/${code.value.trim()}`; }
    catch (e) { err.textContent = e.message; }
  }
  $('#go').onclick = go;
  code.addEventListener('keydown', (e) => e.key === 'Enter' && go());
  (async () => {
    try {
      const list = await api('/api/library');
      lib.replaceChildren();
      if (!list.length) { lib.append(h('p', { class: 'muted' }, 'Aucun quiz disponible pour le moment.')); return; }
      for (const q of list) {
        lib.append(h('a', { class: 'btn', href: `/q/${q.id}` },
          `${q.title} · ${q.questions} question${q.questions > 1 ? 's' : ''}` + (q.players ? ` · ${q.players} joueur${q.players > 1 ? 's' : ''}` : '')));
      }
    } catch (e) { lib.replaceChildren(h('p', { class: 'error' }, e.message)); }
  })();
</script>
{% endblock %}
