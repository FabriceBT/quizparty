{% extends "base.html" %}
{% block body %}
<main class="wrap">
  <section class="card center stack">
    <h1>🎮 Choisis un quiz</h1>
    <input type="search" id="search" placeholder="🔎 Rechercher un quiz…" autocomplete="off" class="hidden">
    <div class="teams" id="cats"></div>
    <div class="stack" id="lib"><p class="muted">Chargement…</p></div>
    <button class="btn ghost install-btn hidden" id="install">📲 Installer l'application sur mon téléphone</button>
    <p class="muted hidden" id="ios-hint">Sur iPhone : touchez <b>Partager</b> puis <b>Sur l'écran d'accueil</b> pour installer l'application.</p>
    <details class="stack">
      <summary class="muted">J'ai un code de partie</summary>
      <input class="code-input" id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="off">
      <div class="error" id="err"></div>
      <button class="btn pink" id="go">Rejoindre</button>
    </details>
    <a class="btn ghost" href="/">Retour</a>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script>
  const code = $('#code'), err = $('#err'), lib = $('#lib'), search = $('#search'), cats = $('#cats');
  let all = [], cat = '';
  async function go() {
    err.textContent = '';
    try { await api(`/api/sessions/${code.value.trim()}/exists`); location.href = `/j/${code.value.trim()}`; }
    catch (e) { err.textContent = e.message; }
  }
  $('#go').onclick = go;
  code.addEventListener('keydown', (e) => e.key === 'Enter' && go());

  const norm = (t) => (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const best = (id) => { try { return +localStorage.getItem(`qp_best_${id}`) || 0; } catch (_) { return 0; } };

  function draw() {
    const term = norm(search.value);
    const shown = all.filter((q) => (!cat || q.category === cat) && (!term || norm(`${q.title} ${q.description} ${q.category}`).includes(term)));
    lib.replaceChildren();
    if (!shown.length) { lib.append(h('p', { class: 'muted' }, all.length ? 'Aucun quiz ne correspond.' : 'Aucun quiz disponible pour le moment.')); return; }
    shown.sort((a, b) => b.daily - a.daily);                          // le quiz du jour en premier
    for (const q of shown) {
      const rec = best(q.id);
      lib.append(h('a', { class: 'btn' + (q.daily ? ' pink' : ''), href: `/q/${q.id}`, style: 'display:block;text-align:center' },
        q.daily ? h('small', { style: 'display:block' }, '⭐ Quiz du jour') : null,
        h('span', { style: 'display:block' }, q.title),
        h('small', { style: 'display:block;font-weight:600;opacity:.9' },
          `${q.questions} question${q.questions > 1 ? 's' : ''}` + (q.players ? ` · ${q.players} joueur${q.players > 1 ? 's' : ''} cette semaine` : '') + (rec ? ` · 🏅 ${rec} pts` : ''))));
    }
  }
  function drawCats() {
    const names = [...new Set(all.map((q) => q.category).filter(Boolean))].sort();
    cats.replaceChildren();
    if (!names.length) return;
    for (const n of ['', ...names]) {
      const b = h('button', { class: 'team' + (n === cat ? ' on' : ''), onclick: () => { cat = n; drawCats(); draw(); } }, n || 'Tous');
      cats.append(b);
    }
  }
  search.addEventListener('input', draw);
  (async () => {
    try {
      all = await api('/api/library');
      if (all.length > 5) search.classList.remove('hidden');
      drawCats(); draw();
    } catch (e) { lib.replaceChildren(h('p', { class: 'error' }, e.message)); }
  })();

  // Installation de l'application (Android / Chrome) ; sur iPhone on explique le geste.
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; $('#install').classList.remove('hidden'); });
  $('#install').onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; $('#install').classList.add('hidden'); } };
  window.addEventListener('appinstalled', () => $('#install').classList.add('hidden'));
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone) $('#ios-hint').classList.remove('hidden');
</script>
{% endblock %}
