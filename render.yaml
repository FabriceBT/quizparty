# Déploiement GRATUIT sur Render.com : « New + » → « Blueprint » → choisir ce dépôt GitHub.
# Limites de l'offre gratuite : le service s'endort après 15 min sans visite (30-60 s de réveil) et son disque est effacé
# à chaque redémarrage. Les quiz du dossier « seed » (fichiers .zip de sauvegarde) sont rechargés automatiquement.
services:
  - type: web
    name: quizparty
    runtime: docker
    plan: free
    healthCheckPath: /play
    envVars:
      - key: QUIZ_ADMIN_PASSWORD
        sync: false          # à saisir dans le tableau de bord Render
# Pour garder aussi les classements entre les redémarrages : plan « starter » + un disque
#   plan: starter
#   disk: { name: quizdata, mountPath: /data, sizeGB: 1 }
